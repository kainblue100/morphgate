[project]
name = "morphgate"
version = "0.1.0"
description = "Predict only the morphology-linked part of a spatial transcriptome from H&E."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "pillow",
  "matplotlib",
]

[project.scripts]
morphgate = "morphgate.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
